[project]
name = "ai-trip-planner"
version = "0.1.0"
description = "Rude AI travel planner: FastAPI + LangGraph agent backend with a Streamlit UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
    "slowapi>=0.1.9,<1",
    "groq>=0.30,<1",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-groq>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-tavily>=0.2,<1",
    "langchain-google-community[places]>=3,<6",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2"]
dev = ["pytest>=8", "httpx>=0.27", "pip-audit>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
